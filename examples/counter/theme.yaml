# Дизайн-токены и темы — поддерживают кастомные темы, hot-reload, анимации
active: light
tokens:
  colors:
    primary-600: "#3b82f6"
    primary-500: "#60a5fa"
    neutral-100: "#f3f4f6"
    neutral-800: "#1f2937"
  spacing:
    sm: "4px"
    md: "8px"
    lg: "16px"
    xl: "24px"
  radius:
    sm: "4px"
    md: "8px"
    lg: "12px"
  typography:
    fontSans: "Inter, system-ui, sans-serif"
    fontSizeBase: "16px"
  shadows:
    sm: "0 1px 2px rgba(0,0,0,0.05)"
    md: "0 4px 6px rgba(0,0,0,0.1)"
  animations:
    durationFast: "150ms"
    durationNormal: "300ms"
    durationSlow: "500ms"
    easingDefault: "ease"
    easingSpring: "cubic-bezier(0.34, 1.56, 0.64, 1)"
    easingEaseOut: "cubic-bezier(0, 0, 0.2, 1)"
themes:
  light:
    sl-color-primary-600: "#3b82f6"
    sl-color-primary-500: "#60a5fa"
    sl-color-neutral-100: "#f3f4f6"
    sl-color-neutral-800: "#1f2937"
    app-bg: "#ffffff"
    app-text: "#111827"
  dark:
    sl-color-primary-600: "#3b82f6"
    sl-color-primary-500: "#60a5fa"
    sl-color-neutral-100: "#1f2937"
    sl-color-neutral-800: "#f3f4f6"
    app-bg: "#111827"
    app-text: "#f9fafb"
  # кастомная тема — пользователь может добавлять свои
  ocean:
    sl-color-primary-600: "#0ea5e9"
    sl-color-primary-500: "#38bdf8"
    sl-color-neutral-100: "#f0f9ff"
    sl-color-neutral-800: "#0c4a6e"
    app-bg: "#e0f2fe"
    app-text: "#082f49"